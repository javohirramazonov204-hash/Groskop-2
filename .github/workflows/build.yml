name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip
        run: |
          echo "Repo ichidagi fayllar:"
          ls -R | head -40
          ZIP="$(find . -iname '*.zip' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "ZIP TOPILMADI: repo'ga VirtualGyro-fixed.zip yuklang"
            exit 1
          fi
          unzip -q "$ZIP"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: VirtualGyro
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualGyro-apk
          path: VirtualGyro/app/build/outputs/apk/debug/*.apk
